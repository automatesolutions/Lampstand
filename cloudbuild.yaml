# Builds the Cloud Run image with NEXT_PUBLIC_* baked in at build time.
# Substitutions: _IMAGE, _NEXT_PUBLIC_SUPABASE_URL, _NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - NEXT_PUBLIC_SUPABASE_URL=${_NEXT_PUBLIC_SUPABASE_URL}
      - --build-arg
      - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
timeout: 2400s
options:
  machineType: E2_HIGHCPU_8
